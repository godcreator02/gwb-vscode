# pnpm 11 起，设置都写在这个文件里（package.json 的 pnpm 字段已不再读取）。
#
# 插件放在 plugins/<短名>/，配套的 VS Code 扩展放在 extension/（不是 gwb 插件，不经 devkit 发版）。
#
# 文档站不收进来：装了 docfirst 六区的文档站自带 pnpm-workspace.yaml、自己一套依赖、自己 install——
# 收进来就成了 workspace 里嵌套 workspace，pnpm 不支持这种结构。

packages:
  - plugins/*
  - extension

allowBuilds:
  # 打包器，安装脚本要下载二进制——不允许它运行，pnpm build 直接失败
  esbuild: true
  # vsce 打包扩展时要用
  '@vscode/vsce-sign': true
  # vsce 发布到市场用的可选原生模块，本机只打包不发布
  keytar: false
